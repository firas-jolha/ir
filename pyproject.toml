[project]
name = "ir"
version = "0.1.0"
description = "Information Retrieval Course Materials"
readme = "README.md"
authors = [
    { name = "firas-jolha", email = "f.jolha@innopolis.university" }
]
requires-python = ">=3.9"
dependencies = [
    "bs4>=0.0.2",
    "feedparser>=6.0.12",
    "ipykernel>=6.31.0",
    "nltk>=3.9.2",
    "requests>=2.32.5",
]

[project.scripts]
ir = "ir:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
